project:
  type: manuscript
  output-dir: out
  # Render the article alone. Otherwise Quarto also renders FACTS.md and
  # reviews/ as notebook previews and links them from the paper, except
  # when the checkout's path contains a hidden directory, so the HTML would
  # depend on where the checkout lives.
  render:
    - index.qmd

format:
  html:
    toc: true
    toc-depth: 3
    theme: cosmo
    link-citations: true
  pdf:
    toc: false
    number-sections: true
    colorlinks: true
    link-citations: true
    header-includes:
      - \usepackage{tgpagella}
      - \usepackage[scaled=0.94]{helvet}
      - \usepackage[scaled=0.9]{inconsolata}

execute:
  echo: false
  warning: false
  message: false

manuscript:
  article: index.qmd
