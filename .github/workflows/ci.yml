name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen --extra dev --extra analysis pytest -q
      - run: uv run --frozen --extra dev --extra analysis ruff check snap_qc_sim analysis tests scripts_build_model_data.py
