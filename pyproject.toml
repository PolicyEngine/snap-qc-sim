[project]
name = "snap-qc-sim"
version = "0.1.0"
description = "Monte Carlo simulation of SNAP payment error rates, QC sampling, and state cost-share exposure under policy and audit choices"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2,<3",
    "pyreadstat>=1.2.8,<2",
    "quantile-forest==1.4.1",
    "scikit-learn>=1.8,<1.9",
    "scipy>=1.17,<1.18",
]
dev = ["pytest>=8,<10", "ruff>=0.4,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snap_qc_sim"]

[tool.ruff]
line-length = 88
