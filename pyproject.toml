[project]
name = "snap-qc-sim"
version = "0.1.0"
description = "Monte Carlo simulation of SNAP payment error rates, QC sampling, and state cost-share exposure under policy and audit choices"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snap_qc_sim"]

[tool.ruff]
line-length = 88
